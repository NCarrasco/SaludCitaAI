            type: string
            format: uuid
          in: query
          name: center_id
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: doctor_id
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: specialty_id
          required: false
        - schema:
            type: string
            minLength: 2
            maxLength: 80
          in: query
          name: q
          required: false
        - schema:
            type: integer
