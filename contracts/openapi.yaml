            type: string
            format: uuid
          in: path
          name: id
          required: true
        - schema:
            type: string
            minLength: 8
            maxLength: 200
          in: header
          name: idempotency-key
          required: true
      security: *a3
      responses:
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - intent_id
                  - command_id
                  - correlation_id
                properties:
                  status:
                    type: string
                  intent_id:
                    type: string
                    format: uuid
                  command_id:
                    type: string
                    format: uuid
                  correlation_id:
                    type: string
                    format: uuid
        "400":
          description: Default Response
          content:
            application/json:
              schema:
