      summary: "Canjea un código de recuperación: nueva sesión en este dispositivo y nuevo código (el anterior queda usado)"
      tags:
        - Acceso sin registro (pasarela)
      description: "Límite: 5 intentos cada 15 minutos por IP de visitante. Si el paciente tiene fecha de nacimiento, debe coincidir; si no coincide, el error es el mismo y el código no se consume. El código nunca se registra en logs ni viaja en URLs."
