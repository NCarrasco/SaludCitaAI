      summary: Reclama comandos durables con lease (recordatorios, comprobantes PDF, limpieza de invitados)
      tags: &a6
        - Interno (n8n)
      description: Un lease vencido (n8n caído o reiniciado) se puede reclamar de nuevo; cada comando lleva su correlation_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kinds:
                  type: array
                  items:
                    anyOf:
                      - type: string
                        enum:
                          - appointment.confirm
                      - type: string
                        enum:
                          - offer.answer
                      - type: string
                        enum:
                          - reminder.24h
                      - type: string
                        enum:
                          - reminder.1h
                      - type: string
                        enum:
                          - receipt.render
                      - type: string
                        enum:
                          - maintenance.guest_cleanup
                  minItems: 1
                limit:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 10
              additionalProperties: false
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - command_id
                        - kind
                        - lease_token
                        - attempt
                        - correlation_id
                        - aggregate_id
                        - payload
                      properties:
                        command_id:
                          type: string
                          format: uuid
                        kind:
                          type: string
                        lease_token:
                          type: string
                          format: uuid
                        attempt:
                          type: integer
                        correlation_id:
                          anyOf:
                            - type: string
                              format: uuid
                            - type: "null"
                        aggregate_id:
                          anyOf:
                            - type: string
                              format: uuid
                            - type: "null"
                        payload: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
