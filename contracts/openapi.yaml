      summary: Prepara una reserva, cancelación o reprogramación pendiente de confirmación explícita
      tags:
        - Intenciones y confirmación
      description: Valida la operación contra la agenda real y devuelve un token de un solo uso con caducidad. No modifica citas ni retiene el horario. Crear una intención nueva invalida las pendientes del paciente.
