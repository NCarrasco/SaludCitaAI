# GENERADO por apps/api/src/openapi-export.ts — no editar a mano. Regenerar: npm run openapi:export
openapi: 3.1.0
info:
  title: SaludCita AI API
  version: 0.1.0
  description: "API de agenda de consulta externa de un hospital SIMULADO con datos ficticios. PostgreSQL es la fuente de verdad; toda escritura pasa por intenciones con confirmación explícita. Errores: {error:{code,message,details},request_id}. Fechas RFC 3339 con desplazamiento; zona de negocio America/Santo_Domingo."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token de sesión de paciente (pat_…) o de servicio (svc_…)
    adminCookie:
      type: apiKey
      in: cookie
      name: sc_admin
      description: Sesión administrativa HttpOnly emitida por POST /auth/login. Las peticiones que modifican estado requieren además la cabecera X-CSRF-Token.
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - request_id
      properties:
        error:
          type: object
          required:
            - code
            - message
            - details
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: {}
        request_id:
          type: string
      title: ErrorResponse
    SlotView:
      type: object
      required:
        - slot_id
        - doctor_service_id
        - starts_at
        - ends_at
        - label
        - timezone
        - doctor
        - specialty
        - center
        - consultation_kind
        - patient_instructions
      properties:
        slot_id:
          type: string
          format: uuid
        doctor_service_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        ends_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        label:
          type: string
          description: Fecha completa en español y zona de negocio
        timezone:
          type: string
        doctor:
          type: object
          required:
            - id
            - display_name
          properties:
            id:
              type: string
              format: uuid
            display_name:
              type: string
        specialty:
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        center:
          type: object
          required:
            - id
            - name
            - address
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            address:
              anyOf:
                - type: string
                - type: "null"
        consultation_kind:
          anyOf:
            - type: string
              enum:
                - initial
            - type: string
              enum:
                - follow_up
        patient_instructions:
          anyOf:
            - type: string
            - type: "null"
      title: SlotView
    AppointmentView:
      type: object
      required:
        - id
        - booking_reference
        - status
        - version
        - advance_opt_in
        - booked_at
        - cancelled_at
        - cancellation_reason_code
        - slot
      properties:
        id:
          type: string
          format: uuid
        booking_reference:
          type: string
          description: Referencia para mostrar; no autentica ni autoriza acceso
        status:
          anyOf:
            - type: string
              enum:
                - booked
            - type: string
              enum:
                - cancelled
            - type: string
              enum:
                - completed
            - type: string
              enum:
                - no_show
        version:
          type: integer
          minimum: 1
        advance_opt_in:
          type: boolean
        booked_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        cancelled_at:
          anyOf:
            - type: string
              format: date-time
              description: RFC 3339 con desplazamiento
            - type: "null"
        cancellation_reason_code:
          anyOf:
            - type: string
            - type: "null"
        slot:
          $ref: "#/components/schemas/SlotView"
      title: AppointmentView
    PatientView:
      type: object
      required:
        - id
        - full_name
        - birth_date
        - phone
        - email
        - profile_complete
        - kind
      properties:
        id:
          type: string
          format: uuid
        full_name:
          anyOf:
            - type: string
            - type: "null"
        birth_date:
          anyOf:
            - type: string
              format: date
              description: Fecha local AAAA-MM-DD
            - type: "null"
        phone:
          anyOf:
            - type: string
            - type: "null"
          description: Teléfono de contacto. No sirve para identificarse
        email:
          anyOf:
            - type: string
            - type: "null"
          description: Correo de contacto. No sirve para identificarse
        profile_complete:
          type: boolean
          description: "Tiene nombre, fecha de nacimiento y un contacto (teléfono o correo): lo necesario para reservar"
        kind:
          anyOf:
            - type: string
              enum:
                - account
            - type: string
              enum:
                - guest
          description: guest = sesión invitada sin registro previo
      title: PatientView
    PreparedIntent:
      type: object
      required:
        - intent_id
        - kind
        - token
        - expires_at
        - holds_slot
        - summary
      properties:
        intent_id:
          type: string
          format: uuid
        kind:
          anyOf:
            - type: string
              enum:
                - booking
            - type: string
              enum:
                - cancellation
            - type: string
              enum:
                - reschedule
        token:
          type: string
          description: Token opaco de un solo uso; se envía en la confirmación. No lo recibe el modelo.
        expires_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        holds_slot:
          type: boolean
          description: Una intención no retiene el horario; se revalida al confirmar
          enum:
            - false
        summary:
          type: object
          properties:
            slot:
              $ref: "#/components/schemas/SlotView"
            appointment:
              $ref: "#/components/schemas/AppointmentView"
            new_slot:
              $ref: "#/components/schemas/SlotView"
      title: PreparedIntent
    ConfirmResult:
      type: object
      required:
        - intent_id
        - kind
        - outcome
        - appointment
      properties:
        intent_id:
          type: string
          format: uuid
        kind:
          anyOf:
            - type: string
              enum:
                - booking
            - type: string
              enum:
                - cancellation
            - type: string
              enum:
                - reschedule
        outcome:
          anyOf:
            - type: string
              enum:
                - booked
            - type: string
              enum:
                - cancelled
            - type: string
              enum:
                - already_cancelled
            - type: string
              enum:
                - rescheduled
        appointment:
          $ref: "#/components/schemas/AppointmentView"
      title: ConfirmResult
    Notification:
      type: object
      required:
        - id
        - kind
        - title
        - body
        - appointment_id
        - offer_id
        - sent_at
        - read_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        title:
          type: string
        body:
          type: string
        appointment_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        offer_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        sent_at:
          anyOf:
            - type: string
              format: date-time
              description: RFC 3339 con desplazamiento
            - type: "null"
          description: Publicado en la bandeja web (no implica lectura)
        read_at:
          anyOf:
            - type: string
              format: date-time
              description: RFC 3339 con desplazamiento
            - type: "null"
      title: Notification
    AdminUser:
      type: object
      required:
        - id
        - email
        - display_name
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          anyOf:
            - type: string
            - type: "null"
        role:
          anyOf:
            - type: string
              enum:
                - viewer
            - type: string
              enum:
                - operator
            - type: string
              enum:
                - admin
      title: AdminUser
    ScheduleImpact:
      type: object
      required:
        - blocked_free_slots
        - reopened_slots
        - generated_slots
        - conflicts
      properties:
        blocked_free_slots:
          type: integer
        reopened_slots:
          type: integer
        generated_slots:
          type: integer
        conflicts:
          type: array
          items:
            type: object
            required:
              - appointment_id
              - booking_reference
              - starts_at
              - label
              - doctor
              - patient_name
              - reason
            properties:
              appointment_id:
                type: string
                format: uuid
              booking_reference:
                type: string
              starts_at:
                type: string
              label:
                type: string
              doctor:
                type: string
              patient_name:
                anyOf:
                  - type: string
                  - type: "null"
              reason:
                anyOf:
                  - type: string
                    enum:
                      - outside_rules
                  - type: string
                    enum:
                      - doctor_absence
                  - type: string
                    enum:
                      - service_inactive
          description: "Citas reservadas afectadas. NO se cancelan ni se mueven: requieren gestión explícita."
      title: ScheduleImpact
    AdvanceOffer:
      type: object
      required:
        - id
        - status
        - expires_at
        - offered_at
        - demo_mode
        - appointment
        - offered_slot
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        expires_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        offered_at:
          type: string
          format: date-time
          description: RFC 3339 con desplazamiento
        demo_mode:
          type: boolean
        appointment:
          type: object
          required:
            - id
            - booking_reference
            - current_label
          properties:
            id:
              type: string
              format: uuid
            booking_reference:
              type: string
            current_label:
              type: string
        offered_slot:
          type: object
          required:
            - slot_id
            - starts_at
            - label
            - doctor
          properties:
            slot_id:
              type: string
              format: uuid
            starts_at:
              type: string
              format: date-time
              description: RFC 3339 con desplazamiento
            label:
              type: string
            doctor:
              type: string
      title: AdvanceOffer
    ConversationAction:
      anyOf:
        - type: object
          required:
            - type
            - item
          properties:
            type:
              type: string
              enum:
                - menu
            item:
              anyOf:
                - type: string
                  enum:
                    - book
                - type: string
                  enum:
                    - my_appointments
                - type: string
                  enum:
                    - cancel
                - type: string
                  enum:
                    - reschedule
                - type: string
                  enum:
                    - handoff
                - type: string
                  enum:
                    - help
          additionalProperties: false
        - type: object
          required:
            - type
            - specialty_id
          properties:
            type:
              type: string
              enum:
                - choose_specialty
            specialty_id:
              type: string
              format: uuid
          additionalProperties: false
        - type: object
          required:
            - type
            - index
          properties:
            type:
              type: string
              enum:
                - choose_date
            index:
              type: integer
              minimum: 1
              maximum: 10
          additionalProperties: false
        - type: object
          required:
            - type
            - index
          properties:
            type:
              type: string
              enum:
                - select_option
            index:
              type: integer
              minimum: 1
              maximum: 10
          additionalProperties: false
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - more_options
          additionalProperties: false
        - type: object
          required:
            - type
            - appointment_id
          properties:
            type:
              type: string
              enum:
                - choose_appointment
            appointment_id:
              type: string
              format: uuid
          additionalProperties: false
        - type: object
          required:
            - type
            - intent_id
          properties:
            type:
              type: string
              enum:
                - intent_result
            intent_id:
              type: string
              format: uuid
          additionalProperties: false
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - discard_proposal
          additionalProperties: false
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - resume
          additionalProperties: false
          description: Retomar la gestión de cita en curso tras cambiar de tema
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - book_with
            specialty_id:
              type: string
              format: uuid
            doctor_id:
              type: string
              format: uuid
            date_from:
              type: string
              format: date
            date_to:
              type: string
              format: date
            date_label:
              type: string
              maxLength: 80
            time_of_day:
              anyOf:
                - type: string
                  enum:
                    - morning
                - type: string
                  enum:
                    - afternoon
          additionalProperties: false
      title: ConversationAction
    AssistantReply:
      type: object
      required:
        - text
        - mode
      properties:
        text:
          type: string
        mode:
          anyOf:
            - type: string
              enum:
                - ai
            - type: string
              enum:
                - deterministic
            - type: string
              enum:
                - fallback_menu
            - type: string
              enum:
                - system
          description: "ai: intención extraída por el modelo local y ejecutada por reglas; deterministic: botón sin modelo; fallback_menu: el modelo falló o no estaba disponible; system: resultado de una operación leído de PostgreSQL"
        options:
          type: array
          items:
            type: object
            required:
              - index
              - slot_id
              - label
              - doctor
              - specialty
              - starts_at
            properties:
              index:
                type: integer
              slot_id:
                type: string
                format: uuid
              label:
                type: string
              doctor:
                type: string
              specialty:
                type: string
              starts_at:
                type: string
        more_options:
          type: boolean
        change_specialty:
          type: boolean
          description: "Reserva: mostrar «Elegir otra especialidad» junto a los horarios"
        date_choices:
          type: array
          items:
            type: object
            required:
              - index
              - label
            properties:
              index:
                type: integer
              label:
                type: string
        specialty_choices:
          type: array
          items:
            type: object
            required:
              - id
              - name
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
        appointment_choices:
          type: array
          items:
            type: object
            required:
              - appointment_id
              - label
            properties:
              appointment_id:
                type: string
                format: uuid
              label:
                type: string
        proposal:
          type: object
          required:
            - kind
            - summary
          properties:
            kind:
              anyOf:
                - type: string
                  enum:
                    - booking
                - type: string
                  enum:
                    - cancellation
                - type: string
                  enum:
                    - reschedule
            slot_id:
              type: string
              format: uuid
            appointment_id:
              type: string
              format: uuid
            expected_version:
              type: integer
            new_slot_id:
              type: string
              format: uuid
            summary:
              type: string
        menu:
          type: boolean
        handoff_reference:
          type: string
        suggestions:
          type: array
          items:
            type: object
            required:
              - label
              - action
            properties:
              label:
                type: string
              action:
                $ref: "#/components/schemas/ConversationAction"
          description: Acciones concretas ante intención incierta (se envían como action)
        clarification:
          type: boolean
          description: La respuesta pide aclaración; se mide aparte del éxito directo
        lang:
          type: string
          description: Idioma de la conversación (es, en, pt…)
        lang_fallback:
          type: boolean
          description: "Los datos de agenda se muestran en español: no hay plantillas verificadas para ese idioma"
        generated:
          type: boolean
          description: Texto de conversación general generado por el modelo y validado (capa 1)
        topic:
          type: string
        service_topic:
          type: string
          description: Tema institucional respondido con datos verificados (rama «informacion»)
        schedule:
          type: object
          required:
            - center
            - specialty
            - closed_days
            - doctors
          properties:
            center:
              type: string
            specialty:
              anyOf:
                - type: string
                - type: "null"
            closed_days:
              type: array
              items:
                type: integer
                minimum: 1
                maximum: 7
              description: Días sin consulta (1 = lunes)
            doctors:
              type: array
              items:
                type: object
                required:
                  - specialty
                  - doctor
                  - ranges
                properties:
                  specialty:
                    type: string
                  doctor:
                    type: string
                  ranges:
                    type: array
                    items:
                      type: object
                      required:
                        - days
                        - start
                        - end
                      properties:
                        days:
                          type: array
                          items:
                            type: integer
                            minimum: 1
                            maximum: 7
                        start:
                          type: string
                        end:
                          type: string
          description: Horario de consulta estructurado (rama «informacion», tema horarios) para dibujarlo como tarjeta; `text` es la versión accesible
      title: AssistantReply
paths:
  /api/v1/health/live:
    get:
      operationId: getHealthLive
      summary: Proceso vivo
      tags:
        - Salud
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /api/v1/health/ready:
    get:
      operationId: getHealthReady
      summary: Listo para atender (conexión a PostgreSQL y migraciones aplicadas)
      tags:
        - Salud
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - unavailable
  /api/v1/admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: "Portada operativa: hoy y próximas citas, actividad reciente, solicitudes de ayuda, disponibilidad y alertas"
      tags: &a1
        - "Panel: operación en vivo"
      description: Citas por fecha de atención y operaciones por fecha en que ocurrieron. Paciente y referencia solo para operator/admin; un viewer recibe cifras agregadas (scope = aggregate). `date` (por defecto, hoy) y los filtros afectan a indicadores, agenda y operaciones del día; próximas citas y actividad usan solo los filtros; alertas y solicitudes son de todo el hospital.
      parameters:
        - schema:
            type: string
            format: date
          in: query
          name: date
          required: false
          description: Fecha local AAAA-MM-DD
        - schema:
            type: string
            format: uuid
          in: query
          name: center_id
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: specialty_id
          required: false
        - schema:
            type: string
            format: uuid
          in: query
          name: doctor_id
          required: false
      security: &a2
        - adminCookie: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/admin/events:
    get:
      operationId: streamAdminEvents
      summary: "Eventos en vivo (Server-Sent Events): avisos de invalidación tras cada cambio confirmado"
      tags: *a1
      description: "Eventos: hello, change {topic, kind, at[, id]}, resync (volver a consultar todo), degraded, session-ended. Sin datos personales: el panel vuelve a pedir los datos a los endpoints autorizados. Latido cada 20 s."
      security: *a2
      responses:
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/patient-auth/login:
    post:
      operationId: patientLogin
      summary: Inicia sesión con una cuenta ficticia de paciente
      tags:
        - Autenticación de pacientes
      description: "Devuelve un token Bearer opaco (prefijo pat_). Lo guarda el backend de Gradio; nunca se expone a otros pacientes. Límite: 10 intentos por IP y usuario cada 5 minutos."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  minLength: 3
                  maxLength: 40
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - token
                  - token_type
                  - expires_at
                  - patient
                properties:
                  token:
                    type: string
                  token_type:
                    type: string
                    enum:
                      - Bearer
                  expires_at:
                    type: string
                    format: date-time
                    description: RFC 3339 con desplazamiento
                  patient:
                    $ref: "#/components/schemas/PatientView"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/patient-auth/logout:
    post:
      operationId: patientLogout
      summary: Revoca la sesión actual
      tags:
        - Autenticación de pacientes
      security: &a3
        - bearerAuth: []
      responses:
        "204":
          description: Default Response
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/patient-auth/me:
    get:
      operationId: getPatientMe
      summary: Paciente de la sesión
      tags:
        - Autenticación de pacientes
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
