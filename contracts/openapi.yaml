  /api/v1/conversation/messages:
    post:
      operationId: postConversationMessage
      summary: Envía un mensaje de texto (lo interpreta la IA vía n8n) o una acción de botón (procesamiento determinista)
      tags:
        - Conversación
      description: El paciente se obtiene de la sesión. client_message_id deduplica reintentos. Texto → 202 y se consulta GET /conversation/updates/{id}. Acción → 200 con la respuesta inmediata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - client_message_id
              properties:
                client_message_id:
                  type: string
                  format: uuid
                text:
                  type: string
                  minLength: 1
                  maxLength: 1000
                action:
                  $ref: "#/components/schemas/ConversationAction"
                reply_to:
                  type: object
                  required:
                    - role
                    - text
                  properties:
                    role:
                      anyOf:
                        - type: string
                          enum:
                            - user
                        - type: string
                          enum:
                            - assistant
                    text:
                      type: string
                      minLength: 1
                      maxLength: 500
                  additionalProperties: false
                  description: Mensaje citado (respuesta tipo WhatsApp). Solo contexto para el modelo; no autoriza nada
              additionalProperties: false
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - status
                  - duplicate
                  - reply
                properties:
                  update_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  duplicate:
                    type: boolean
                  reply:
                    anyOf:
                      - $ref: "#/components/schemas/AssistantReply"
                      - type: "null"
        "202":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - status
                  - duplicate
                  - reply
                properties:
                  update_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                  duplicate:
                    type: boolean
                  reply:
                    type: "null"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversation/updates/{id}:
    get:
      operationId: getConversationUpdate
      summary: Estado y respuesta de un mensaje propio (404 si es ajeno)
      tags:
        - Conversación
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - status
                  - reply
                properties:
                  update_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: pending | done | failed
                  attempts:
                    type: integer
                  reply:
                    anyOf:
                      - $ref: "#/components/schemas/AssistantReply"
                      - type: "null"
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/conversation:
    get:
      operationId: getConversation
      summary: Historial reciente de la conversación del paciente (memoria persistente)
      tags:
        - Conversación
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          in: query
          name: limit
          required: false
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - state_step
                  - messages
                properties:
                  state_step:
                    type: string
                  messages:
                    type: array
                    items:
                      type: object
                      required:
                        - direction
                        - content
                        - mode
                        - created_at
                        - reply
                        - reply_to
                      properties:
                        direction:
                          type: string
                        content:
                          type: string
                        mode:
                          anyOf:
                            - type: string
                            - type: "null"
                        created_at:
                          type: string
                        reply:
                          anyOf:
                            - $ref: "#/components/schemas/AssistantReply"
                            - type: "null"
                        reply_to:
                          anyOf:
                            - type: object
                              required:
                                - role
                                - text
                              properties:
                                role:
                                  type: string
                                text:
                                  type: string
                            - type: "null"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/internal/llm/chat:
    post:
      operationId: llmGatewayChat
      summary: Pasarela al proveedor del modelo (compatible con OpenAI) con formato de petición y respuesta de Ollama
      tags:
        - Interno (n8n)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                      content:
                        type: string
              additionalProperties: true
      security: *a3
      responses:
        "200":
          description: Default Response
  /api/v1/internal/updates/claim:
    post:
      operationId: claimConversationUpdates
      summary: Reclama mensajes de texto pendientes con lease y devuelve la petición completa para Ollama
      tags:
        - Interno (n8n)
      description: Serializa los turnos por conversación y recupera leases vencidos tras reinicios. La petición al modelo la construye la API (prompt versionado); n8n solo la reenvía y devuelve el resultado con /ack.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                update_id:
                  type: string
                  format: uuid
                limit:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 5
              additionalProperties: false
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - update_id
                        - lease_token
                        - prompt_version
                        - llm
                      properties:
                        update_id:
                          type: string
                          format: uuid
                        lease_token:
                          type: string
                          format: uuid
                        prompt_version:
                          type: string
                        correlation_id:
                          type: string
                          format: uuid
                        mensaje_paciente:
                          type: string
                        responde_a:
                          anyOf:
                            - type: object
                              required:
                                - role
                                - text
                              properties:
                                role:
                                  type: string
                                text:
                                  type: string
                            - type: "null"
                        llm:
                          type: object
                          required:
                            - url
                            - timeout_ms
                            - body
                          properties:
                            url:
                              type: string
                            timeout_ms:
                              type: integer
                            body:
                              type: object
                              additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/internal/updates/{id}/ack:
    post:
      operationId: ackConversationUpdate
      summary: Entrega el resultado del modelo (o su error); la API valida el JSON y ejecuta la máquina de estados
      tags:
        - Interno (n8n)
      description: Si la respuesta admite redacción natural, devuelve status «drafting» con una segunda petición para Ollama (prompt draft-v1); n8n la ejecuta y entrega el texto en /draft. La respuesta verificada ya queda guardada.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_token
                - llm
              properties:
                lease_token:
                  type: string
                  format: uuid
                llm:
                  type: object
                  required:
                    - ok
                  properties:
                    ok:
                      type: boolean
                    content:
                      type: string
                      maxLength: 20000
                    model:
                      type: string
                      maxLength: 200
                    prompt_eval_count:
                      type: integer
                      minimum: 0
                    eval_count:
                      type: integer
                      minimum: 0
                    latency_ms:
                      type: integer
                      minimum: 0
                    error:
                      type: string
                      maxLength: 2000
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - status
                  - reply
                properties:
                  update_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: done | drafting
                  reply:
                    $ref: "#/components/schemas/AssistantReply"
                  lease_token:
                    type: string
                    format: uuid
                  prompt_version:
                    type: string
                  decision:
                    type: object
                    description: Resumen legible de la decisión (visible en n8n)
                    additionalProperties: {}
                  llm:
                    type: object
                    required:
                      - url
                      - timeout_ms
                      - body
                    properties:
                      url:
                        type: string
                      timeout_ms:
                        type: integer
                      body:
                        type: object
                        additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/internal/updates/{id}/route:
    post:
      operationId: routeConversationUpdate
      summary: "Fase 1: valida la interpretación del modelo y decide la rama del mensaje (no ejecuta nada)"
      tags:
        - Interno (n8n)
      description: Devuelve `route` (conversacion, disponibilidad, aclaracion, operacion, confirmacion, mis_citas, personal, fallo_modelo). n8n enruta con un Switch por ese valor y llama a /branch/{route}. Repetir devuelve la misma rama.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_token
                - llm
              properties:
                lease_token:
                  type: string
                  format: uuid
                llm:
                  type: object
                  required:
                    - ok
                  properties:
                    ok:
                      type: boolean
                    content:
                      type: string
                      maxLength: 20000
                    model:
                      type: string
                      maxLength: 200
                    prompt_eval_count:
                      type: integer
                      minimum: 0
                    eval_count:
                      type: integer
                      minimum: 0
                    latency_ms:
                      type: integer
                      minimum: 0
                    error:
                      type: string
                      maxLength: 2000
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - lease_token
                  - route
                  - status
                properties:
                  update_id:
                    type: string
                    format: uuid
                  lease_token:
                    type: string
                    format: uuid
                  route:
                    anyOf:
                      - anyOf:
                          - type: string
                            enum:
                              - conversacion
                          - type: string
                            enum:
                              - informacion
                          - type: string
                            enum:
                              - disponibilidad
                          - type: string
                            enum:
                              - aclaracion
                          - type: string
                            enum:
                              - operacion
                          - type: string
                            enum:
                              - confirmacion
                          - type: string
                            enum:
                              - mis_citas
                          - type: string
                            enum:
                              - personal
                          - type: string
                            enum:
                              - fallo_modelo
                      - type: "null"
                  status:
                    type: string
                  decision:
                    type: object
                    additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/internal/updates/{id}/branch/{route}:
    post:
      operationId: executeConversationBranch
      summary: "Fase 2: ejecuta la rama decidida (409 route_mismatch si n8n pide otra)"
      tags:
        - Interno (n8n)
      description: "Misma respuesta que /ack: «done» con la respuesta verificada o «drafting» con la petición de redacción para Ollama."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - lease_token
              properties:
                lease_token:
                  type: string
                  format: uuid
      parameters:
        - schema:
            type: string
            format: uuid
          in: path
          name: id
          required: true
        - schema:
            anyOf:
              - type: string
                enum:
                  - conversacion
              - type: string
                enum:
                  - informacion
              - type: string
                enum:
                  - disponibilidad
              - type: string
                enum:
                  - aclaracion
              - type: string
                enum:
                  - operacion
              - type: string
                enum:
                  - confirmacion
              - type: string
                enum:
                  - mis_citas
              - type: string
                enum:
                  - personal
              - type: string
                enum:
                  - fallo_modelo
          in: path
          name: route
          required: true
      security: *a3
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - update_id
                  - status
                  - reply
                properties:
                  update_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: done | drafting
                  reply:
                    $ref: "#/components/schemas/AssistantReply"
                  lease_token:
                    type: string
                    format: uuid
                  prompt_version:
                    type: string
                  decision:
                    type: object
                    additionalProperties: {}
                  llm:
                    type: object
                    required:
                      - url
                      - timeout_ms
                      - body
                    properties:
                      url:
                        type: string
                      timeout_ms:
                        type: integer
                      body:
                        type: object
                        additionalProperties: {}
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
