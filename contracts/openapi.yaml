                        type: string
                        format: uuid
                      weekday:
                        type: integer
                      local_start:
                        type: string
                      local_end:
                        type: string
                      valid_from:
                        type: string
                        format: date
                        description: Fecha local AAAA-MM-DD
                      valid_until:
