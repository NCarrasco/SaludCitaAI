                      - Bearer
                  expires_at:
                    type: string
                    format: date-time
                    description: RFC 3339 con desplazamiento
                  patient:
                    $ref: "#/components/schemas/PatientView"
                  new_recovery_code:
                    type: string
                    description: Mostrar una sola vez
                  new_recovery_code_expires_at:
                    type: string
                    format: date-time
