                  additionalProperties: false
                  title: BookingIntent
                - type: object
                  required:
                    - kind
                    - appointment_id
                    - expected_version
                  properties:
                    kind:
                      type: string
                      enum:
                        - cancellation
                    appointment_id:
                      type: string
                      format: uuid
                    expected_version:
                      type: integer
                      minimum: 1
                    reason_code:
                      anyOf:
                        - type: string
                          enum:
                            - patient_request
                        - type: string
                          enum:
                            - provider_unavailable
                        - type: string
                          enum:
                            - scheduling_error
                        - type: string
                          enum:
                            - other
                  additionalProperties: false
                  title: CancellationIntent
                - type: object
                  required:
                    - kind
                    - appointment_id
                    - expected_version
                    - new_slot_id
                  properties:
                    kind:
                      type: string
                      enum:
                        - reschedule
                    appointment_id:
                      type: string
                      format: uuid
                    expected_version:
                      type: integer
                      minimum: 1
                    new_slot_id:
                      type: string
                      format: uuid
                  additionalProperties: false
                  title: RescheduleIntent
