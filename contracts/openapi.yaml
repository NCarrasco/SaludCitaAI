  /api/v1/auth/login:
    post:
      operationId: adminLogin
      summary: Inicia una sesión administrativa (panel). Devuelve cookies, no un token en JavaScript.
      tags:
        - "Administración: sesión"
      description: "Establece la cookie HttpOnly `sc_admin` (sesión) y la cookie legible `sc_csrf`. Toda petición que modifique estado debe enviar la cabecera `X-CSRF-Token` con el valor de `csrf_token` (o de la cookie `sc_csrf`). Límite: 10 intentos por IP y correo cada 5 minutos."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 200
                password:
                  type: string
                  minLength: 1
                  maxLength: 200
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                  - csrf_token
                  - expires_at
                properties:
                  user:
                    $ref: "#/components/schemas/AdminUser"
                  csrf_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
                    description: RFC 3339 con desplazamiento
        "400":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Default Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
