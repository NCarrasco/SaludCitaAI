                enum:
                  - booked
              - type: string
                enum:
                  - cancelled
              - type: string
                enum:
                  - completed
              - type: string
                enum:
                  - no_show
          in: query
          name: status
          required: false
          description: "`active` = no canceladas (reservadas, asistió y no asistió). Sin valor: todas"
